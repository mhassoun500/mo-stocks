name: Tests

# Runs the automated tests on every push and pull request, before anything is built.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q tests/py
      - name: Analysis engine tests
        run: node --test tests/js/engine.test.js
      - name: Page builds and every text has an English version
        run: |
          python tools/build_page.py
          python tools/i18n/extract.py --missing | tee missing.txt
          grep -q " 0 without translation" missing.txt
