name: Live sources check

# Run by hand (Actions > Live sources check > Run workflow): checks that the outside sources still answer
# the way the app reads them. Nothing is built or published.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the sources
        run: |
          python -m pip install --upgrade pypdf certifi websocket-client
          python tools/live_check.py | tee live.txt || true
          python tools/live_probe.py | tee -a live.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sources-report
          path: live.txt
